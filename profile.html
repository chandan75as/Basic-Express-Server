<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade Abhyaas - My Profile</title>
    <meta name="description" content="Manage your Trade Abhyaas Profile.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui", "-apple-system", "BlinkMacSystemFont", "Segoe UI", "sans-serif"] }
                }
            }
        };
    </script>
    <style>
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            background: radial-gradient(circle at 50% -15%, rgba(16, 185, 129, .11), transparent 34%), 
                        radial-gradient(circle at 90% 25%, rgba(6, 182, 212, .07), transparent 25%), #020617;
        }
        .ambient { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
        .ambient::before {
            content: ""; position: absolute; inset: 0; opacity: .22;
            background-image: linear-gradient(rgba(148, 163, 184, .055) 1px, transparent 1px), linear-gradient(90deg, rgba(148, 163, 184, .055) 1px, transparent 1px);
            background-size: 52px 52px; mask-image: linear-gradient(to bottom, #000 0, transparent 72%);
        }
        .orb { position: absolute; width: 420px; height: 420px; border-radius: 999px; filter: blur(90px); opacity: .12; }
        .orb-1 { background: #10b981; top: 4%; left: -12%; }
        .orb-2 { background: #06b6d4; top: 22%; right: -14%; }
        .orb-3 { background: #8b5cf6; bottom: -10%; left: 36%; }
        
        .glass { background: rgba(15, 23, 42, .58); border: 1px solid rgba(148, 163, 184, .1); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
        .glass-strong { background: linear-gradient(145deg, rgba(15, 23, 42, .88), rgba(2, 6, 23, .76)); border: 1px solid rgba(148, 163, 184, .12); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); }
        
        .nav-active { color: #34d399; transform: scale(1.05); transition: all .2s ease-in-out; }
        .nav-inactive { color: #64748b; transition: all .2s ease-in-out; }
    </style>
</head>
<body class="min-h-screen text-slate-100 font-sans antialiased overflow-x-hidden flex flex-col">

    <div class="ambient">
        <div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div>
    </div>

    <!-- Header -->
    <header class="sticky top-0 z-50 border-b border-white/[0.06] bg-slate-950/65 backdrop-blur-2xl">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="h-[72px] flex items-center justify-between">
                <a href="tournament.html" class="group flex items-center gap-3">
                    <div class="relative w-10 h-10 rounded-xl flex items-center justify-center bg-slate-800 border border-white/10 shadow-lg hover:bg-slate-700 transition">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path></svg>
                    </div>
                    <div>
                        <div class="text-base sm:text-lg font-black tracking-tight text-white">My Profile</div>
                    </div>
                </a>
                <div class="flex items-center gap-3 shrink-0">
                    <div class="flex items-center gap-3 px-3 py-1.5 rounded-xl border border-white/10 bg-slate-900/80 shadow-[0_0_15px_rgba(0,0,0,0.5)]">
                        <div class="flex items-center gap-1.5" title="Main Deposit Balance">
                            <span class="text-sm">🪙</span>
                            <span class="text-amber-400 font-bold font-mono text-sm md:text-base" id="main-balance">0</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="relative z-10 flex-grow max-w-2xl mx-auto w-full px-4 py-8 flex flex-col gap-6 mb-20">
        
        <!-- User Info Card -->
        <div class="glass-strong rounded-3xl p-6 md:p-8 relative overflow-hidden border border-emerald-500/20 text-center">
            <div class="absolute -top-10 -right-10 w-40 h-40 bg-emerald-500/10 rounded-full blur-3xl"></div>
            
            <div id="profile-pic-container" class="w-24 h-24 mx-auto rounded-full bg-gradient-to-br from-emerald-500 to-cyan-500 p-1 mb-4 shadow-[0_0_30px_rgba(16,185,129,0.3)]">
                <div class="w-full h-full rounded-full bg-slate-900 overflow-hidden flex items-center justify-center text-3xl font-black text-emerald-400" id="profile-pic">
                    U
                </div>
            </div>
            
            <h2 id="profile-name" class="text-2xl font-black text-white tracking-tight">Loading...</h2>
            <p id="profile-email" class="text-slate-400 text-sm mt-1">user@email.com</p>
            <p class="text-xs text-slate-500 mt-2 font-mono" id="profile-uid">UID: -----</p>

            <div id="vip-badge" class="hidden mt-4 inline-flex items-center gap-1.5 bg-gradient-to-r from-amber-500/20 to-amber-600/20 border border-amber-500/50 text-amber-400 px-4 py-1.5 rounded-full text-xs font-black tracking-wider uppercase shadow-[0_0_15px_rgba(245,158,11,0.2)]">
                👑 VIP Player
            </div>
            <div id="normal-badge" class="mt-4 inline-flex items-center gap-1.5 bg-slate-800/50 border border-slate-700 text-slate-400 px-4 py-1.5 rounded-full text-xs font-bold tracking-wider uppercase">
                Normal Tier
            </div>
        </div>

        <!-- Career Stats -->
        <h3 class="text-lg font-black text-white mt-2">📊 Career Stats</h3>
        <div class="grid grid-cols-2 gap-4">
            <div class="glass p-5 rounded-2xl border border-white/5 text-center">
                <div class="text-3xl mb-2">⚔️</div>
                <div id="total-matches" class="text-2xl font-black text-white font-mono">0</div>
                <div class="text-[10px] text-slate-500 font-bold uppercase tracking-wider mt-1">Matches Played</div>
            </div>
            <div class="glass p-5 rounded-2xl border border-white/5 text-center">
                <div class="text-3xl mb-2">🤝</div>
                <div id="total-referrals" class="text-2xl font-black text-cyan-400 font-mono">0</div>
                <div class="text-[10px] text-slate-500 font-bold uppercase tracking-wider mt-1">Friends Invited</div>
            </div>
        </div>

        <!-- Wallet Breakdown -->
        <h3 class="text-lg font-black text-white mt-2">💼 My Wallets</h3>
        <div class="flex flex-col gap-3">
            <div class="glass p-4 rounded-xl border border-white/5 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-amber-500/10 flex items-center justify-center text-amber-500 text-lg">💰</div>
                    <div>
                        <div class="text-sm font-bold text-white">Deposit Balance</div>
                        <div class="text-xs text-slate-500">For entry fees</div>
                    </div>
                </div>
                <div class="font-mono font-black text-amber-400 text-lg" id="profile-deposit">🪙 0</div>
            </div>

            <div class="glass p-4 rounded-xl border border-white/5 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-purple-500/10 flex items-center justify-center text-purple-400 text-lg">🎁</div>
                    <div>
                        <div class="text-sm font-bold text-white">Bonus Balance</div>
                        <div class="text-xs text-slate-500">Promotional coins</div>
                    </div>
                </div>
                <div class="font-mono font-black text-purple-400 text-lg" id="profile-bonus">🪙 0</div>
            </div>

            <div class="glass p-4 rounded-xl border border-white/5 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-cyan-500/10 flex items-center justify-center text-cyan-400 text-lg">🏆</div>
                    <div>
                        <div class="text-sm font-bold text-white">Winnings</div>
                        <div class="text-xs text-slate-500">Withdrawable cash</div>
                    </div>
                </div>
                <div class="font-mono font-black text-cyan-400 text-lg" id="profile-winnings">🪙 0</div>
            </div>
        </div>

        <!-- Logout Button -->
        <button onclick="logoutUser()" class="mt-4 w-full bg-rose-500/10 border border-rose-500/30 hover:bg-rose-500/20 text-rose-400 font-bold uppercase py-4 rounded-xl text-sm tracking-wider transition flex items-center justify-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            Sign Out
        </button>

    </main>

    <!-- Bottom Nav -->
    <nav class="w-full bg-slate-950/80 border-t border-white/[0.06] fixed bottom-0 z-40 backdrop-blur-2xl">
        <div class="max-w-md mx-auto flex justify-around p-3">
            <button onclick="window.location.href='tournament.html'" class="flex flex-col items-center nav-inactive hover:text-slate-300">
                <span class="text-xl mb-1">🏆</span><span class="text-[10px] font-bold">Tournaments</span>
            </button>
            <button onclick="window.location.href='wallet.html'" class="flex flex-col items-center nav-inactive hover:text-slate-300">
                <span class="text-xl mb-1">💼</span><span class="text-[10px] font-bold">Wallet</span>
            </button>
            <button onclick="window.location.href='refer.html'" class="flex flex-col items-center nav-inactive hover:text-slate-300">
                <span class="text-xl mb-1">🎁</span><span class="text-[10px] font-bold">Refer</span>
            </button>
        </div>
    </nav>

    <!-- Logic Script -->
    <script>
        // Set basic data immediately from Cache
        window.onload = () => {
            let uName = localStorage.getItem("ta_userName") || "Trader";
            let uEmail = localStorage.getItem("ta_userEmail") || "";
            let uPhoto = localStorage.getItem("ta_userPhoto");
            let uid = localStorage.getItem("ta_uid") || "-----";
            
            document.getElementById("profile-name").innerText = uName;
            document.getElementById("profile-email").innerText = uEmail;
            document.getElementById("profile-uid").innerText = "UID: " + uid;
            
            if(uPhoto && uPhoto.length > 5) {
                document.getElementById("profile-pic").innerHTML = `<img src="${uPhoto}" referrerpolicy="no-referrer" class="w-full h-full object-cover">`;
            } else {
                document.getElementById("profile-pic").innerText = uName.charAt(0).toUpperCase();
            }

            document.getElementById("main-balance").innerText = parseInt(localStorage.getItem('ta_balance')) || 0;
            document.getElementById("profile-deposit").innerText = "🪙 " + (parseInt(localStorage.getItem('ta_balance')) || 0);
            document.getElementById("profile-bonus").innerText = "🪙 " + (parseInt(localStorage.getItem('ta_bonus')) || 0);
        };
    </script>

    <!-- Firebase Live Sync Script & Logout -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        let auth;

        async function initLiveSync() {
            try {
                const response = await fetch("/api/firebase-config");
                const config = await response.json();
                const app = initializeApp(config);
                auth = getAuth(app);
                const db = getFirestore(app);
                const uid = localStorage.getItem("ta_uid");
                
                if (uid) {
                    const userRef = doc(db, "users", uid);
                    onSnapshot(userRef, (docSnap) => {
                        if (docSnap.exists()) {
                            let data = docSnap.data();
                            
                            // Balances Update
                            if (data.balance !== undefined) {
                                document.getElementById("main-balance").innerText = data.balance;
                                document.getElementById("profile-deposit").innerText = `🪙 ${data.balance}`;
                            }
                            if (data.bonusBal !== undefined) {
                                document.getElementById("profile-bonus").innerText = `🪙 ${data.bonusBal}`;
                            }
                            if (data.withdrawalBal !== undefined) {
                                document.getElementById("profile-winnings").innerText = `🪙 ${data.withdrawalBal}`;
                            }

                            // Stats Update
                            document.getElementById("total-matches").innerText = data.totalMatches || 0;
                            // Add total referrals logic here if needed later

                            // VIP Status Update
                            if(data.isVIP) {
                                document.getElementById("vip-badge").classList.remove("hidden");
                                document.getElementById("normal-badge").classList.add("hidden");
                                document.getElementById("profile-pic-container").classList.replace("from-emerald-500", "from-amber-400");
                                document.getElementById("profile-pic-container").classList.replace("to-cyan-500", "to-amber-600");
                            }
                        }
                    });
                }
            } catch(err) {
                console.error("Live sync failed", err);
            }
        }
        
        initLiveSync();

        // Safe Logout Function
        window.logoutUser = async () => {
            if(confirm("Are you sure you want to log out?")) {
                try {
                    if(auth) await signOut(auth);
                    // Clear all local storage
                    localStorage.removeItem("ta_uid");
                    localStorage.removeItem("ta_userName");
                    localStorage.removeItem("ta_userEmail");
                    localStorage.removeItem("ta_userPhoto");
                    localStorage.removeItem("ta_balance");
                    localStorage.removeItem("ta_bonus");
                    localStorage.removeItem("ta_withdrawal");
                    localStorage.removeItem("ta_joined");
                    localStorage.removeItem("ta_past");
                    
                    window.location.replace("index.html");
                } catch(e) {
                    alert("Error signing out!");
                }
            }
        };
    </script>

</body>
</html>
