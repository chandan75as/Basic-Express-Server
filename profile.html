<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade Abhyaas - Profile</title>
    <meta name="description" content="Manage your Trade Abhyaas Profile.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui", "-apple-system", "BlinkMacSystemFont", "Segoe UI", "sans-serif"] }
                }
            }
        };
    </script>
    <style>
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            background: radial-gradient(circle at 50% -15%, rgba(16, 185, 129, .05), transparent 34%), 
                        radial-gradient(circle at 90% 25%, rgba(6, 182, 212, .05), transparent 25%), #020617;
        }
        .ambient { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
        .ambient::before {
            content: ""; position: absolute; inset: 0; opacity: .15;
            background-image: linear-gradient(rgba(148, 163, 184, .055) 1px, transparent 1px), linear-gradient(90deg, rgba(148, 163, 184, .055) 1px, transparent 1px);
            background-size: 52px 52px; mask-image: linear-gradient(to bottom, #000 0, transparent 72%);
        }
        
        .glass { background: rgba(15, 23, 42, .4); border: 1px solid rgba(148, 163, 184, .08); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .glass-strong { background: linear-gradient(145deg, rgba(15, 23, 42, .7), rgba(2, 6, 23, .6)); border: 1px solid rgba(148, 163, 184, .1); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        
        .nav-inactive { color: #64748b; transition: all .2s ease-in-out; }
    </style>
</head>
<body class="min-h-screen text-slate-100 font-sans antialiased overflow-x-hidden flex flex-col">

    <div class="ambient"></div>

    <!-- Minimal Header -->
    <header class="sticky top-0 z-50 border-b border-white/[0.04] bg-slate-950/80 backdrop-blur-2xl">
        <div class="max-w-3xl mx-auto px-4">
            <div class="h-[68px] flex items-center justify-between">
                <a href="tournament.html" class="flex items-center gap-3 hover:opacity-80 transition">
                    <div class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center border border-white/10">
                        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path></svg>
                    </div>
                    <span class="text-lg font-black tracking-tight text-white">Profile</span>
                </a>
            </div>
        </div>
    </header>

    <main class="relative z-10 flex-grow max-w-3xl mx-auto w-full px-4 py-6 flex flex-col gap-5 mb-20">
        
        <!-- User Identity Card -->
        <div class="glass-strong rounded-3xl p-6 relative overflow-hidden flex flex-col items-center text-center">
            <div id="profile-pic-container" class="w-20 h-20 rounded-full bg-slate-800 border-2 border-slate-700 mb-4 overflow-hidden flex items-center justify-center text-2xl font-black text-slate-400">
                U
            </div>
            
            <h2 id="profile-name" class="text-xl font-black text-white tracking-tight">Trader</h2>
            <p id="profile-email" class="text-slate-400 text-sm mt-0.5">loading...</p>
            
            <div class="mt-3 bg-slate-900/80 border border-slate-700/50 px-4 py-1.5 rounded-lg">
                <span class="text-xs text-slate-500 font-bold uppercase tracking-wider mr-2">UID</span>
                <span id="profile-uid" class="text-sm text-cyan-400 font-mono font-bold tracking-widest">TA-XXXXXX</span>
            </div>

            <!-- VIP Badge (Hidden Default) -->
            <div id="vip-badge" class="hidden mt-4 inline-flex items-center gap-1.5 bg-gradient-to-r from-amber-500/10 to-amber-600/10 border border-amber-500/30 text-amber-400 px-4 py-1.5 rounded-full text-xs font-black tracking-wider uppercase">
                <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                VIP ACTIVE
            </div>
        </div>

        <!-- Matches Stats -->
        <div class="glass p-5 rounded-2xl border border-white/5 flex items-center justify-between">
            <div>
                <div class="text-sm font-bold text-white">Matches Played</div>
                <div class="text-xs text-slate-500 mt-0.5">Total tournaments joined</div>
            </div>
            <div id="total-matches" class="text-2xl font-black text-emerald-400 font-mono">0</div>
        </div>

        <!-- Operations & Settings Menu -->
        <div class="glass rounded-3xl p-2 border border-white/5 flex flex-col">
            
            <!-- KYC -->
            <button onclick="alert('KYC System Coming Soon')" class="flex items-center justify-between p-4 rounded-2xl hover:bg-white/5 transition-colors group">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-cyan-500/10 flex items-center justify-center text-cyan-400">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                    <span class="text-sm font-bold text-slate-200">KYC Verification</span>
                </div>
                <svg class="w-4 h-4 text-slate-600 group-hover:text-slate-300 transition" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
            </button>

            <!-- Bank Details -->
            <button onclick="alert('Bank Details Coming Soon')" class="flex items-center justify-between p-4 rounded-2xl hover:bg-white/5 transition-colors group">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-emerald-500/10 flex items-center justify-center text-emerald-400">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
                    </div>
                    <span class="text-sm font-bold text-slate-200">Bank Details for Withdrawal</span>
                </div>
                <svg class="w-4 h-4 text-slate-600 group-hover:text-slate-300 transition" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
            </button>

            <div class="h-px w-full bg-white/5 my-1"></div>

            <!-- About Game -->
            <button onclick="alert('About Page Coming Soon')" class="flex items-center justify-between p-4 rounded-2xl hover:bg-white/5 transition-colors group">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-slate-400">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                    <span class="text-sm font-bold text-slate-200">About this Game</span>
                </div>
                <svg class="w-4 h-4 text-slate-600 group-hover:text-slate-300 transition" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
            </button>

            <!-- T&C -->
            <button onclick="alert('T&C Coming Soon')" class="flex items-center justify-between p-4 rounded-2xl hover:bg-white/5 transition-colors group">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-slate-400">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    </div>
                    <span class="text-sm font-bold text-slate-200">Terms & Conditions</span>
                </div>
                <svg class="w-4 h-4 text-slate-600 group-hover:text-slate-300 transition" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
            </button>

            <!-- Contact -->
            <button onclick="alert('Contact System Coming Soon')" class="flex items-center justify-between p-4 rounded-2xl hover:bg-white/5 transition-colors group">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-slate-400">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                    </div>
                    <span class="text-sm font-bold text-slate-200">Contact Us</span>
                </div>
                <svg class="w-4 h-4 text-slate-600 group-hover:text-slate-300 transition" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
            </button>

        </div>

        <!-- Logout -->
        <button onclick="logoutUser()" class="w-full bg-slate-900/50 border border-rose-500/20 hover:bg-rose-500/10 text-rose-400 font-bold uppercase py-4 rounded-2xl text-xs tracking-widest transition flex items-center justify-center gap-2 mt-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            Log Out
        </button>

    </main>

    <!-- Bottom Nav -->
    <nav class="w-full bg-slate-950/90 border-t border-white/[0.04] fixed bottom-0 z-40 backdrop-blur-2xl">
        <div class="max-w-md mx-auto flex justify-around p-3">
            <button onclick="window.location.href='tournament.html'" class="flex flex-col items-center nav-inactive hover:text-slate-300">
                <span class="text-xl mb-1">🏆</span><span class="text-[10px] font-bold">Tournaments</span>
            </button>
            <button onclick="window.location.href='wallet.html'" class="flex flex-col items-center nav-inactive hover:text-slate-300">
                <span class="text-xl mb-1">💼</span><span class="text-[10px] font-bold">Wallet</span>
            </button>
            <button onclick="window.location.href='refer.html'" class="flex flex-col items-center nav-inactive hover:text-slate-300">
                <span class="text-xl mb-1">🎁</span><span class="text-[10px] font-bold">Refer</span>
            </button>
        </div>
    </nav>

    <!-- Logic Script -->
    <script>
        // Set Local Cache Data
        window.onload = () => {
            let uName = localStorage.getItem("ta_userName") || "Trader";
            let uEmail = localStorage.getItem("ta_userEmail") || "";
            let uPhoto = localStorage.getItem("ta_userPhoto");
            let uid = localStorage.getItem("ta_uid") || "------";
            
            // Format UID properly (TA-XXXXXX)
            let formattedUid = "TA-" + uid.substring(0,6).toUpperCase();
            
            document.getElementById("profile-name").innerText = uName;
            document.getElementById("profile-email").innerText = uEmail;
            document.getElementById("profile-uid").innerText = formattedUid;
            
            if(uPhoto && uPhoto.length > 5) {
                document.getElementById("profile-pic").innerHTML = `<img src="${uPhoto}" referrerpolicy="no-referrer" class="w-full h-full object-cover">`;
                document.getElementById("profile-pic-container").classList.remove("p-4"); // Remove padding for image
            } else {
                document.getElementById("profile-pic").innerText = uName.charAt(0).toUpperCase();
            }
        };
    </script>

    <!-- Firebase Live Sync Script & Logout -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        let auth;

        async function initLiveSync() {
            try {
                const response = await fetch("/api/firebase-config");
                const config = await response.json();
                const app = initializeApp(config);
                auth = getAuth(app);
                const db = getFirestore(app);
                const uid = localStorage.getItem("ta_uid");
                
                if (uid) {
                    const userRef = doc(db, "users", uid);
                    onSnapshot(userRef, (docSnap) => {
                        if (docSnap.exists()) {
                            let data = docSnap.data();
                            
                            // Stats Update
                            document.getElementById("total-matches").innerText = data.totalMatches || 0;

                            // VIP Logic (Only show if True)
                            if(data.isVIP === true) {
                                document.getElementById("vip-badge").classList.remove("hidden");
                                document.getElementById("profile-pic-container").classList.replace("border-slate-700", "border-amber-500/50");
                            }
                        }
                    });
                }
            } catch(err) {
                console.error("Live sync failed", err);
            }
        }
        
        initLiveSync();

        // Secure Logout
        window.logoutUser = async () => {
            if(confirm("Log out from Trade Abhyaas?")) {
                try {
                    if(auth) await signOut(auth);
                    localStorage.clear(); // Clears everything safely
                    window.location.replace("index.html");
                } catch(e) {
                    alert("Error signing out!");
                }
            }
        };
    </script>

</body>
</html>
