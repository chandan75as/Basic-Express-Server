<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade Abhyaas - Payout Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui", "-apple-system", "sans-serif"] },
                }
            }
        };
    </script>
    <style>
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            background-color: #020617;
            background-image: 
                radial-gradient(at 0% 0%, rgba(6, 182, 212, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(16, 185, 129, 0.12) 0px, transparent 50%);
        }
        
        @keyframes loader-spin { to { transform: rotate(360deg); } }
        .loader-ring { animation: loader-spin 1s linear infinite; }
        
        .glass-strong { 
            background: rgba(15, 23, 42, 0.85); 
            border: 1px solid rgba(148, 163, 184, 0.15); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px); 
        }
        
        /* PREMIUM INPUT STYLES */
        .input-field { 
            width: 100%; 
            background-color: #0f172a; 
            border: 1px solid #334155; 
            border-radius: 0.75rem; 
            padding: 0.75rem 1rem; 
            color: #ffffff; 
            font-weight: 600;
            letter-spacing: 0.025em;
            transition: all 0.2s ease; 
        }
        .input-field::placeholder { color: #64748b; font-weight: 500; }
        .input-field:focus { 
            outline: none; 
            border-color: #06b6d4; 
            box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.2); 
            background-color: #020617;
        }

        /* 3D Button Style - Cyan Theme for Payouts */
        .btn-3d-cyan {
            background: linear-gradient(to bottom, #06b6d4, #0891b2);
            box-shadow: 0 4px 0 #0e7490, 0 8px 15px rgba(0,0,0,0.2);
            border: 1px solid #22d3ee;
            transition: all 0.1s ease;
        }
        .btn-3d-cyan:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #0e7490, 0 2px 5px rgba(0,0,0,0.2);
        }
        .btn-3d-cyan:disabled {
            background: #334155;
            box-shadow: 0 4px 0 #0f172a;
            border-color: #475569;
            color: #94a3b8;
            cursor: not-allowed;
        }

        /* Toggle Button Styles */
        .tab-btn { @apply flex-1 py-3 text-sm font-bold transition-all duration-300 rounded-xl flex items-center justify-center gap-2; }
        .tab-active { @apply bg-cyan-500/20 text-cyan-400 border border-cyan-500/50 shadow-[0_0_15px_rgba(6,182,212,0.1)]; }
        .tab-inactive { @apply bg-slate-900/50 text-slate-500 hover:text-slate-300 border border-transparent hover:border-slate-700; }
    </style>
</head>
<body class="min-h-screen text-slate-100 font-sans antialiased overflow-x-hidden flex flex-col">

    <!-- Loading Screen -->
    <div id="page-loader" class="fixed inset-0 z-[100] bg-slate-950 flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="relative w-16 h-16 flex items-center justify-center">
            <div class="loader-ring absolute inset-0 rounded-full border-4 border-cyan-500/20 border-t-cyan-500"></div>
            <svg class="w-6 h-6 text-cyan-400 absolute" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
        </div>
        <h2 class="mt-5 text-sm font-black tracking-[0.2em] text-white">TRADE ABHYAAS</h2>
        <div class="mt-2 text-xs text-slate-500 tracking-wider">SECURE PAYOUT GATEWAY...</div>
    </div>

    <!-- Minimal Header -->
    <header class="sticky top-0 z-50 border-b border-slate-800/80 bg-slate-950/80 backdrop-blur-xl">
        <div class="max-w-3xl mx-auto px-4">
            <div class="h-[70px] flex items-center justify-between">
                <a href="profile.html" class="flex items-center gap-3 hover:opacity-80 transition">
                    <div class="w-10 h-10 rounded-xl bg-slate-900 border border-slate-700 flex items-center justify-center text-slate-300">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path></svg>
                    </div>
                    <div>
                        <div class="text-lg font-black tracking-tight text-white flex items-center gap-2">
                            Payout Settings <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        </div>
                        <div class="text-[10px] uppercase text-slate-400 font-bold tracking-widest">Bank & UPI Details</div>
                    </div>
                </a>
            </div>
        </div>
    </header>

    <main class="relative z-10 flex-grow max-w-2xl mx-auto w-full px-4 py-8 flex flex-col gap-6 mb-10">
        
        <!-- Live Balance Banner -->
        <div class="glass-strong rounded-2xl p-5 border border-slate-700 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-full bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-cyan-400 shrink-0">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                </div>
                <div>
                    <h3 class="font-bold text-slate-400 text-xs uppercase tracking-widest">Withdrawable Balance</h3>
                    <div class="text-2xl font-black text-cyan-400 font-mono mt-0.5" id="display-withdrawal">🪙 0</div>
                </div>
            </div>
        </div>

        <!-- Tab Switcher -->
        <div class="flex bg-slate-900/60 p-1.5 border border-slate-800 rounded-2xl">
            <button onclick="switchMethod('upi')" id="tab-upi" class="tab-btn tab-active">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
                UPI ID
            </button>
            <button onclick="switchMethod('bank')" id="tab-bank" class="tab-btn tab-inactive">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
                Bank Transfer
            </button>
        </div>

        <!-- Form Container -->
        <form id="payout-form" class="flex flex-col gap-6">
            
            <!-- UPI SECTION -->
            <div id="section-upi" class="glass-strong rounded-2xl p-6 border border-slate-800 animate-fade-in block">
                <h2 class="text-sm font-black text-white mb-5 uppercase tracking-wider flex items-center gap-2">
                    <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg> Virtual Payment Address
                </h2>
                
                <div class="flex flex-col gap-4">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5 ml-1">UPI ID</label>
                        <input type="text" id="upi-id" placeholder="e.g. yourname@ybl or 9876543210@paytm" class="input-field lowercase">
                        <p class="text-[10px] text-slate-500 mt-1.5 ml-1">Supports GPay, PhonePe, Paytm, BHIM</p>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5 ml-1">Account Holder Name (As in Bank)</label>
                        <input type="text" id="upi-name" placeholder="Name registered with this UPI" class="input-field uppercase">
                    </div>
                </div>
            </div>

            <!-- BANK SECTION -->
            <div id="section-bank" class="glass-strong rounded-2xl p-6 border border-slate-800 animate-fade-in hidden">
                <h2 class="text-sm font-black text-white mb-5 uppercase tracking-wider flex items-center gap-2">
                    <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 14v3m4-3v3m4-3v3M3 21h18M3 10h18M3 7l9-4 9 4M4 10h16v11H4V10z"/></svg> Direct Bank Transfer
                </h2>
                
                <div class="flex flex-col gap-4">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5 ml-1">Account Holder Name</label>
                        <input type="text" id="bank-name" placeholder="As per bank records" class="input-field uppercase">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5 ml-1">Account Number</label>
                        <input type="password" id="bank-acc" placeholder="Enter Account Number" class="input-field font-mono tracking-widest">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5 ml-1">Confirm Account Number</label>
                        <input type="text" id="bank-acc-confirm" placeholder="Re-enter Account Number" class="input-field font-mono tracking-widest">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5 ml-1">IFSC Code</label>
                        <input type="text" id="bank-ifsc" placeholder="e.g. SBIN0001234" maxlength="11" class="input-field uppercase font-mono">
                    </div>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submit-btn" class="w-full btn-3d-cyan text-slate-950 font-black uppercase py-4 rounded-xl text-sm tracking-widest flex items-center justify-center gap-2 mt-2">
                <svg class="w-5 h-5 text-slate-950" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                Save Payout Details
            </button>
            <p class="text-center text-[10px] text-slate-500 font-bold tracking-wide mt-[-10px] uppercase flex items-center justify-center gap-1.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg> Payment Data Encrypted Securely
            </p>
        </form>

    </main>

    <!-- Toasts -->
    <div id="toast-container" class="fixed top-5 right-5 z-[9999] flex flex-col gap-2 pointer-events-none"></div>

    <script>
        // Global State for active tab
        let activeMethod = 'upi';

        function switchMethod(method) {
            activeMethod = method;
            let tabUpi = document.getElementById('tab-upi');
            let tabBank = document.getElementById('tab-bank');
            let secUpi = document.getElementById('section-upi');
            let secBank = document.getElementById('section-bank');

            if(method === 'upi') {
                tabUpi.className = "tab-btn tab-active";
                tabBank.className = "tab-btn tab-inactive";
                secUpi.classList.replace("hidden", "block");
                secBank.classList.replace("block", "hidden");
            } else {
                tabBank.className = "tab-btn tab-active";
                tabUpi.className = "tab-btn tab-inactive";
                secBank.classList.replace("hidden", "block");
                secUpi.classList.replace("block", "hidden");
            }
        }

        function showToast(msg, type) {
            let box = document.getElementById("toast-container");
            let el = document.createElement("div");
            let icon = type === 'success' ? '<svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>' 
                       : '<svg class="w-5 h-5 text-rose-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>';
            let bgClass = type === 'success' ? 'bg-emerald-500/10 border-emerald-500/30' : 'bg-rose-500/10 border-rose-500/30';
            
            el.className = `p-4 rounded-xl shadow-lg text-sm font-bold flex items-center gap-3 transform transition-all duration-300 translate-x-full opacity-0 border backdrop-blur-md ${bgClass} text-white`;
            el.innerHTML = `${icon} <span>${msg}</span>`;
            box.appendChild(el);
            setTimeout(() => el.classList.remove("translate-x-full", "opacity-0"), 10);
            setTimeout(() => { el.classList.add("translate-x-full", "opacity-0"); setTimeout(() => el.remove(), 300); }, 3500);
        }

        window.onload = () => {
            let wBal = parseInt(localStorage.getItem('ta_withdrawal')) || 0;
            document.getElementById('display-withdrawal').innerText = `🪙 ${wBal}`;

            setTimeout(() => {
                const loader = document.getElementById('page-loader');
                if(loader) {
                    loader.classList.add('opacity-0', 'pointer-events-none');
                    setTimeout(() => loader.remove(), 500);
                }
            }, 400);
        };
    </script>

    <!-- Firebase Live Sync & Submission Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        let db;
        let userRef;
        const uid = localStorage.getItem("ta_uid");

        async function initFirebase() {
            try {
                const response = await fetch("/api/firebase-config");
                const config = await response.json();
                const app = initializeApp(config);
                db = getFirestore(app);
                
                if (uid) {
                    userRef = doc(db, "users", uid);
                    const userSnap = await getDoc(userRef);
                    
                    if(userSnap.exists()) {
                        let data = userSnap.data();
                        // Pre-fill if data already exists
                        if(data.payoutDetails) {
                            if(data.payoutDetails.method === 'upi') {
                                document.getElementById('upi-id').value = data.payoutDetails.upiId || "";
                                document.getElementById('upi-name').value = data.payoutDetails.accName || "";
                                switchMethod('upi');
                            } else if (data.payoutDetails.method === 'bank') {
                                document.getElementById('bank-name').value = data.payoutDetails.accName || "";
                                document.getElementById('bank-ifsc').value = data.payoutDetails.ifsc || "";
                                // We don't pre-fill account number for security reasons
                                switchMethod('bank');
                            }
                        }
                    }
                }
            } catch(err) {
                console.error("Firebase init failed:", err);
            }
        }
        initFirebase();

        // Handle Form Submission
        document.getElementById('payout-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            let payoutData = { method: activeMethod };

            if(activeMethod === 'upi') {
                let upiId = document.getElementById('upi-id').value.trim();
                let upiName = document.getElementById('upi-name').value.trim().toUpperCase();

                if(!upiId.includes('@')) {
                    showToast("Please enter a valid UPI ID (must contain '@')", "error");
                    return;
                }
                if(!upiName) {
                    showToast("Please enter Account Holder Name", "error");
                    return;
                }
                payoutData.upiId = upiId;
                payoutData.accName = upiName;
            } 
            else {
                let bName = document.getElementById('bank-name').value.trim().toUpperCase();
                let bAcc1 = document.getElementById('bank-acc').value.trim();
                let bAcc2 = document.getElementById('bank-acc-confirm').value.trim();
                let ifsc = document.getElementById('bank-ifsc').value.trim().toUpperCase();

                if(bAcc1 !== bAcc2) {
                    showToast("Account Numbers do not match!", "error");
                    return;
                }
                if(ifsc.length !== 11) {
                    showToast("Invalid IFSC Code. It must be exactly 11 characters.", "error");
                    return;
                }
                payoutData.accName = bName;
                payoutData.accountNumber = bAcc1;
                payoutData.ifsc = ifsc;
            }

            let btn = document.getElementById('submit-btn');
            btn.innerHTML = "Processing Details... ⏳";
            btn.disabled = true;

            try {
                // Save to Firebase securely
                if(userRef) {
                    await updateDoc(userRef, { payoutDetails: payoutData });
                }
                
                // Realistic processing delay
                setTimeout(() => {
                    showToast("Payout details saved securely!", "success");
                    btn.innerHTML = "Details Saved ✅";
                    btn.classList.replace("btn-3d-cyan", "bg-emerald-600");
                    btn.classList.add("text-white", "border-emerald-500");
                    
                    setTimeout(() => {
                        window.location.replace("wallet.html");
                    }, 1500);
                }, 1500);

            } catch(error) {
                showToast("Failed to save details. Try again.", "error");
                btn.innerHTML = "Save Payout Details";
                btn.disabled = false;
            }
        });
    </script>

</body>
</html>
