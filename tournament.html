<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade Abhyaas - Tournament Lobby</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/brain.js"></script>

    <style>
        .brand-logo {
            font-weight: 900;
            font-style: italic;
            letter-spacing: 0.05em;
            background: linear-gradient(135deg, #34d399 0%, #22d3ee 50%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 12px rgba(52, 211, 153, 0.3));
        }

        .tab-active { background: linear-gradient(135deg, #0f766e, #042f2e); color: #34d399; font-weight: bold; border: 1px solid #14b8a6; box-shadow: 0 0 15px rgba(20,184,166,0.2); }
        .tab-inactive { color: #94a3b8; font-weight: 500; background: #0b1320; border: 1px solid #1e293b; }

        .nav-active { color: #34d399; transform: scale(1.08); transition: all 0.2s ease-in-out; }
        .nav-inactive { color: #64748b; transition: all 0.2s ease-in-out; }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        .dur-btn {
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            background: #09101d;
            border: 1px solid #1e293b;
            color: #94a3b8;
            transition: all 0.25s ease;
        }
        .dur-btn.active {
            background: linear-gradient(135deg, #059669, #047857);
            color: #ffffff;
            border-color: #34d399;
            box-shadow: 0 0 15px rgba(52,211,153,0.4);
        }

        .glass-card {
            background: linear-gradient(145deg, rgba(13, 20, 33, 0.95), rgba(7, 11, 19, 0.95));
            border: 1px solid rgba(52, 211, 153, 0.15);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .glass-card:hover {
            border-color: rgba(52, 211, 153, 0.4);
            box-shadow: 0 12px 35px rgba(52, 211, 153, 0.1);
        }
    </style>
</head>
<body class="bg-[#030712] text-slate-100 font-sans min-h-screen flex flex-col selection:bg-emerald-500 selection:text-slate-950">

    <!-- Loading Screen -->
    <div id="page-loader" class="fixed inset-0 z-50 bg-[#030712] flex flex-col items-center justify-center transition-opacity duration-700">
        <div class="relative flex items-center justify-center">
            <div class="w-20 h-20 border-4 border-emerald-500/20 border-t-emerald-400 rounded-full animate-spin"></div>
            <div class="absolute text-emerald-400 font-black text-xl animate-pulse">TA</div>
        </div>
        <h2 class="mt-4 text-xl font-black tracking-widest text-white animate-pulse bg-clip-text text-transparent bg-gradient-to-r from-emerald-400 to-cyan-400">TRADE ABHYAAS</h2>
        <p class="text-slate-500 text-xs mt-1">Loading Secure Arena...</p>
    </div>

    <!-- Header -->
    <header class="w-full bg-[#070e17]/90 border-b border-slate-800/80 px-4 md:px-8 py-4 sticky top-0 z-40 backdrop-blur-xl">
        <div class="max-w-7xl mx-auto flex justify-between items-center gap-4">
            <div class="brand-logo text-lg md:text-2xl flex items-center gap-2.5 truncate">
                <span class="bg-emerald-500/10 border border-emerald-500/30 p-1.5 rounded-xl text-base shadow-lg shadow-emerald-500/10">📈</span>
                <span class="truncate">Trade Abhyaas</span>
            </div>

            <div class="flex items-center gap-3 md:gap-4 shrink-0">
                <div class="bg-slate-900/90 border border-amber-500/40 px-3.5 py-2 rounded-xl flex items-center gap-2.5 cursor-pointer hover:bg-slate-800 transition shadow-lg shadow-amber-500/5" onclick="window.location.href='top-up.html'">
                    <span class="text-base">🪙</span>
                    <span class="text-amber-400 font-bold font-mono text-sm md:text-base" id="main-balance">500</span>
                    <div class="bg-amber-500 text-slate-950 rounded-full w-5 h-5 flex items-center justify-center font-black text-xs shadow-md">+</div>
                </div>
                <div onclick="window.location.href='profile.html'" class="h-9 w-9 bg-gradient-to-tr from-cyan-600 to-teal-500 rounded-xl flex items-center justify-center font-bold shadow-lg shadow-cyan-500/20 cursor-pointer hover:scale-105 transition text-white">
                    U
                </div>
            </div>
        </div>
    </header>

    <!-- Main Lobby -->
    <main class="flex-grow max-w-7xl mx-auto w-full p-4 md:p-8 flex flex-col gap-6 mb-20 md:mb-10">

        <!-- Tabs -->
        <div class="flex bg-[#070e17] rounded-2xl p-1.5 border border-slate-800/80 max-w-md mx-auto w-full shadow-2xl">
            <button onclick="switchTab('upcoming')" id="tab-upcoming" class="flex-1 py-2.5 rounded-xl text-sm transition tab-active">Upcoming</button>
            <button onclick="switchTab('joined')" id="tab-joined" class="flex-1 py-2.5 rounded-xl text-sm transition tab-inactive hover:text-white">Joined</button>
            <button onclick="switchTab('results')" id="tab-results" class="flex-1 py-2.5 rounded-xl text-sm transition tab-inactive hover:text-white">Results</button>
        </div>

        <!-- UPCOMING CONTENT -->
        <div id="content-upcoming" class="flex flex-col gap-6">
            <div class="flex gap-3 overflow-x-auto pb-3 pt-1 scrollbar-hide justify-start lg:justify-center" id="duration-filters">
                <button class="dur-btn" onclick="setDuration(15, this)">15 Min</button>
                <button class="dur-btn active" onclick="setDuration(30, this)">30 Min</button>
                <button class="dur-btn" onclick="setDuration(60, this)">1 Hour</button>
                <button class="dur-btn" onclick="setDuration(120, this)">2 Hour</button>
                <button class="dur-btn" onclick="setDuration(240, this)">4 Hour</button>
                <button class="dur-btn" onclick="setDuration(10080, this)">1 Week</button>
                <button class="dur-btn" onclick="setDuration(43200, this)">1 Month</button>
            </div>

            <!-- Dynamic Matches Container -->
            <div id="dynamic-tournaments" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 pb-6"></div>
        </div>

        <!-- JOINED CONTENT -->
        <div id="content-joined" class="hidden flex-col gap-6 pb-10">
            <div id="joined-empty" class="text-center py-20">
                <span class="text-5xl mb-3 block">🎮</span>
                <h3 class="text-xl font-bold text-slate-300">No Joined Matches</h3>
                <p class="text-slate-500 text-sm mt-1">Join an upcoming tournament to view it here.</p>
            </div>
            <div id="joined-tournaments" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>

        <!-- RESULTS CONTENT -->
        <div id="content-results" class="hidden flex-col gap-6 pb-10">
            <div id="results-empty" class="text-center py-20">
                <span class="text-5xl mb-3 block">🏆</span>
                <h3 class="text-xl font-bold text-slate-300">No Past Results</h3>
                <p class="text-slate-500 text-sm mt-1">Completed tournament results will show up here.</p>
            </div>
            <div id="results-tournaments" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="w-full bg-[#070e17]/95 border-t border-slate-800/80 fixed bottom-0 z-40 backdrop-blur-xl">
        <div class="max-w-md mx-auto flex justify-around p-3">
            <button onclick="window.location.href='tournament.html'" class="flex flex-col items-center nav-active">
                <span class="text-xl">🏆</span>
                <span class="text-[10px] font-bold mt-1">Tournaments</span>
            </button>
            <button onclick="window.location.href='wallet.html'" class="flex flex-col items-center nav-inactive hover:text-slate-300">
                <span class="text-xl">💼</span>
                <span class="text-[10px] font-bold mt-1">Wallet</span>
            </button>
            <button onclick="window.location.href='profile.html'" class="flex flex-col items-center nav-inactive hover:text-slate-300">
                <span class="text-xl">👤</span>
                <span class="text-[10px] font-bold mt-1">Profile</span>
            </button>
        </div>
    </nav>

    <script>
        let balance = parseInt(localStorage.getItem('ta_balance')) || 500;
        let activeDuration = 30; 
        let timerIntervals = []; 

        let joinedMatches = JSON.parse(localStorage.getItem('ta_joined')) || [];
        let pastMatches = JSON.parse(localStorage.getItem('ta_past')) || [];

        document.getElementById('main-balance').innerText = balance;

        // ==========================================
        // 1. ROBUST LOCAL STORAGE SLOT GENERATION
        // ==========================================
        function getNextSlots(intervalMins) {
            let slots = [];
            let totalCards = 12; 

            let now = new Date();
            let startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
            let msInterval = intervalMins * 60 * 1000;

            let elapsed = now.getTime() - startOfDay;
            let nextSlotMs = startOfDay + Math.ceil(elapsed / msInterval) * msInterval;

            if(nextSlotMs <= now.getTime()) {
                nextSlotMs += msInterval;
            }

            for(let i = 0; i < totalCards; i++) {
                slots.push(new Date(nextSlotMs + (i * msInterval)));
            }
            return slots;
        }

        function formatTime(dateObj) {
            return dateObj.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
        }

        function formatDay(dateObj) {
            let today = new Date().getDate();
            if(dateObj.getDate() === today) return "Today";
            if(dateObj.getDate() === today + 1) return "Tomorrow";
            return dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        function hasTimeConflict(newStart, newEnd) {
            for(let m of joinedMatches) {
                if (newStart < m.endTime && newEnd > m.startTime) {
                    return true;
                }
            }
            return false;
        }

        function isAlreadyJoined(startTimeMs, durationMins) {
            let id = `${startTimeMs}-${durationMins}`;
            return joinedMatches.some(m => m.uniqueId === id) || pastMatches.some(m => m.uniqueId === id);
        }

        // ==========================================
        // 2. RENDER TOURNAMENTS
        // ==========================================
        function renderTournaments() {
            let container = document.getElementById('dynamic-tournaments');
            container.innerHTML = ""; 

            timerIntervals.forEach(clearInterval);
            timerIntervals = [];

            let slots = getNextSlots(activeDuration);
            let fee = activeDuration === 15 ? 20 : activeDuration === 30 ? 50 : activeDuration === 60 ? 100 : activeDuration === 120 ? 200 : activeDuration === 240 ? 500 : activeDuration === 10080 ? 1000 : 2500;
            let pool = fee * 10;
            let name = activeDuration >= 43200 ? '1 Month Championship' : activeDuration >= 10080 ? '1 Week Cup' : activeDuration >= 60 ? `${activeDuration/60} Hour Marathon` : `${activeDuration} Min Clash`;

            slots.forEach((slotDate, index) => {
                let timestamp = slotDate.getTime();
                if(isAlreadyJoined(timestamp, activeDuration)) return;

                let cardId = `tourney-${activeDuration}-${index}`;
                let spotsFilled = Math.floor(Math.random() * 35) + 25;

                let html = `
                <div id="card-${cardId}" class="glass-card rounded-2xl overflow-hidden transition duration-300 relative flex flex-col justify-between">
                    <div class="absolute top-0 right-0 bg-rose-500/90 text-white text-[10px] font-bold px-3 py-1 rounded-bl-xl z-10 shadow">5% Fee</div>

                    <div class="p-5 border-b border-slate-800/80 relative overflow-hidden">
                        <div class="absolute inset-0 bg-gradient-to-r from-emerald-900/20 to-transparent"></div>
                        <h2 class="text-xl font-black text-white relative z-10 uppercase italic tracking-wide">${name}</h2>
                        <p class="text-xs text-slate-400 relative z-10 mt-1 font-medium">Assets: BTC, ETH, NIFTY 50 & Gold</p>
                    </div>

                    <div class="p-5 grid grid-cols-3 gap-3 text-center bg-slate-950/40">
                        <div class="flex flex-col">
                            <span class="text-[11px] text-slate-400 font-medium">Prize Pool</span>
                            <span class="text-emerald-400 font-bold text-base md:text-lg mt-0.5 font-mono">🪙 ${pool}</span>
                        </div>
                        <div class="flex flex-col border-x border-slate-800/80">
                            <span class="text-[11px] text-slate-400 font-medium">Entry Fee</span>
                            <span class="text-amber-400 font-bold text-base md:text-lg mt-0.5 font-mono">🪙 ${fee}</span>
                        </div>
                        <div class="flex flex-col">
                            <span class="text-[11px] text-slate-400 font-medium">Starts At</span>
                            <span class="text-cyan-400 font-bold text-xs md:text-sm mt-1 font-mono">${formatTime(slotDate)}</span>
                        </div>
                    </div>

                    <div class="px-5 pt-3.5 pb-2">
                        <div class="flex justify-between text-xs mb-1.5 font-medium">
                            <span class="text-slate-300">Spots Filled: ${spotsFilled}%</span>
                            <span class="text-amber-400 font-mono text-xs font-bold" id="timer-${cardId}">
                                Loading...
                            </span>
                        </div>
                        <div class="w-full bg-slate-800/80 rounded-full h-2 overflow-hidden">
                            <div class="bg-gradient-to-r from-emerald-500 to-cyan-400 h-2 rounded-full" style="width: ${spotsFilled}%"></div>
                        </div>
                    </div>

                    <div class="p-4 bg-slate-950/70">
                        <button onclick="joinTournament(${fee}, '${name}', '${cardId}', ${timestamp}, ${activeDuration}, ${pool})" class="w-full bg-gradient-to-r from-amber-500 to-amber-400 hover:from-amber-400 hover:to-amber-300 text-slate-950 font-extrabold uppercase py-3 rounded-xl shadow-[0_0_20px_rgba(245,158,11,0.3)] transition transform active:scale-95 text-sm tracking-wider">
                            Join Now (🪙 ${fee})
                        </button>
                    </div>
                </div>`;

                container.insertAdjacentHTML('beforeend', html);
                startLiveTimer(cardId, timestamp);
            });
        }

        // ==========================================
        // 3. JOIN LOGIC & STORAGE PERSISTENCE
        // ==========================================
        function joinTournament(fee, name, cardId, startTimeMs, duration, pool) {
            let endTimeMs = startTimeMs + (duration * 60 * 1000);

            if (hasTimeConflict(startTimeMs, endTimeMs)) {
                alert("⚠️ You already have an active or joined tournament overlapping this time slot!");
                return;
            }

            if (balance >= fee) {
                let confirmJoin = confirm(`Confirm payment of 🪙 ${fee} to join '${name}'?`);
                if(confirmJoin) {
                    balance -= fee;
                    localStorage.setItem('ta_balance', balance);
                    document.getElementById('main-balance').innerText = balance;

                    joinedMatches.push({
                        uniqueId: `${startTimeMs}-${duration}`,
                        name, fee, pool, startTime: startTimeMs, endTime: endTimeMs, duration
                    });
                    localStorage.setItem('ta_joined', JSON.stringify(joinedMatches));

                    let card = document.getElementById(`card-${cardId}`);
                    if(card) card.remove();

                    renderJoined();
                    alert("🎉 Successfully Joined! Check the 'Joined' tab for arena access.");
                }
            } else {
                alert("Insufficient Coins! Taking you to the Top-up page.");
                window.location.href = 'top-up.html';
            }
        }

        // ==========================================
        // 4. RENDER JOINED & RESULTS
        // ==========================================
        function renderJoined() {
            let container = document.getElementById('joined-tournaments');
            let emptyState = document.getElementById('joined-empty');

            container.innerHTML = "";
            if (joinedMatches.length === 0) {
                emptyState.style.display = "block";
                return;
            }
            emptyState.style.display = "none";

            joinedMatches.forEach((m) => {
                let dateObj = new Date(m.startTime);
                let html = `
                <div class="glass-card border-emerald-500/50 rounded-2xl overflow-hidden shadow-[0_0_25px_rgba(16,185,129,0.15)] relative flex flex-col justify-between">
                    <div class="absolute top-0 right-0 bg-emerald-500 text-slate-950 font-extrabold text-[10px] px-3 py-1 rounded-bl-xl z-10 shadow">JOINED ✅</div>
                    <div class="p-5 border-b border-slate-800">
                        <h2 class="text-xl font-black text-white uppercase italic tracking-wide">${m.name}</h2>
                        <div class="text-sm text-cyan-400 font-bold mt-1 font-mono">Starts: ${formatDay(dateObj)} at ${formatTime(dateObj)}</div>
                    </div>
                    <div class="p-5 grid grid-cols-2 gap-4 text-center bg-slate-950/40">
                        <div class="flex flex-col">
                            <span class="text-xs text-slate-400">Prize Pool</span>
                            <span class="text-emerald-400 font-bold text-lg font-mono">🪙 ${m.pool}</span>
                        </div>
                        <div class="flex flex-col border-l border-slate-800">
                            <span class="text-xs text-slate-400">Entry Fee</span>
                            <span class="text-amber-400 font-bold text-lg font-mono">🪙 ${m.fee} Paid</span>
                        </div>
                    </div>
                    <div class="p-4 bg-slate-950/70">
                        <button onclick="window.location.href='dashboard.html?startTime=${m.startTime}'" class="w-full bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-500 hover:to-cyan-500 text-white font-extrabold uppercase py-3 rounded-xl shadow-[0_0_15px_rgba(37,99,235,0.4)] transition text-sm tracking-wider">
                            Enter Arena ➔
                        </button>
                    </div>
                </div>`;
                container.insertAdjacentHTML('beforeend', html);
            });
        }

        function renderResults() {
            let container = document.getElementById('results-tournaments');
            let emptyState = document.getElementById('results-empty');

            container.innerHTML = "";
            if (pastMatches.length === 0) {
                emptyState.style.display = "block";
                return;
            }
            emptyState.style.display = "none";

            pastMatches.forEach((m) => {
                let dateObj = new Date(m.startTime);
                let html = `
                <div class="glass-card rounded-2xl overflow-hidden opacity-75 flex flex-col justify-between">
                    <div class="p-5 border-b border-slate-800">
                        <h2 class="text-lg font-black text-slate-400 uppercase italic tracking-wide">${m.name}</h2>
                        <div class="text-xs text-slate-500 mt-1 font-mono">Played: ${formatDay(dateObj)} at ${formatTime(dateObj)}</div>
                    </div>
                    <div class="p-4 bg-slate-950 text-center">
                        <button class="w-full bg-slate-800/80 text-slate-400 font-bold uppercase py-2.5 rounded-xl cursor-not-allowed text-xs">
                            Match Ended • Ranks Computed
                        </button>
                    </div>
                </div>`;
                container.insertAdjacentHTML('beforeend', html);
            });
        }

        setInterval(() => {
            let now = Date.now();
            let moved = false;

            joinedMatches = joinedMatches.filter(m => {
                if (now > m.endTime) {
                    pastMatches.push(m);
                    moved = true;
                    return false;
                }
                return true;
            });

            if(moved) {
                localStorage.setItem('ta_joined', JSON.stringify(joinedMatches));
                localStorage.setItem('ta_past', JSON.stringify(pastMatches));
                renderJoined();
                renderResults();
            }
        }, 5000);

        // ==========================================
        // 5. UTILITIES
        // ==========================================
        function startLiveTimer(cardId, targetTimeMs) {
            let timerEl = document.getElementById(`timer-${cardId}`);
            if(!timerEl) return;

            function updateClock() {
                let now = new Date().getTime();
                let diff = targetTimeMs - now;

                if(diff <= 0) {
                    timerEl.innerText = "Match Live!";
                    timerEl.className = "text-emerald-400 font-mono text-xs font-bold";
                    clearInterval(interval);
                    renderTournaments(); 
                } else {
                    let d = Math.floor(diff / (1000 * 60 * 60 * 24));
                    let h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    let m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                    let s = Math.floor((diff % (1000 * 60)) / 1000);
                    
                    if (d > 0) {
                        timerEl.innerText = `${d}d ${h}h ${m}m left`;
                    } else {
                        timerEl.innerText = `${h > 0 ? `${h}h ` : ''}${m}m ${s}s left`;
                    }
                }
            }

            updateClock();
            let interval = setInterval(updateClock, 1000);
            timerIntervals.push(interval);
        }

        function setDuration(mins, btnEl) {
            activeDuration = mins;
            document.querySelectorAll('.dur-btn').forEach(btn => btn.classList.remove('active'));
            btnEl.classList.add('active');
            renderTournaments();
        }

        function switchTab(tabName) {
            let tabs = ['upcoming', 'joined', 'results'];
            tabs.forEach(t => {
                let btn = document.getElementById(`tab-${t}`);
                let content = document.getElementById(`content-${t}`);
                if(t === tabName) {
                    btn.className = "flex-1 py-2.5 rounded-xl text-sm transition tab-active";
                    content.classList.replace('hidden', 'flex');
                } else {
                    btn.className = "flex-1 py-2.5 rounded-xl text-sm transition tab-inactive hover:text-white";
                    content.classList.replace('flex', 'hidden');
                }
            });
        }

        window.onload = () => {
            renderTournaments();
            renderJoined();
            renderResults();

            setTimeout(() => {
                const loader = document.getElementById('page-loader');
                if(loader) {
                    loader.classList.add('opacity-0', 'pointer-events-none');
                    setTimeout(() => loader.remove(), 700);
                }
            }, 400);
        };
    </script>
</body>
</html>
