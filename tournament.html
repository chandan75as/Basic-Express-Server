<!-- New Script added for Firebase Live Sync functionality -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    
    async function initLiveSync() {
        try {
            const response = await fetch("/api/firebase-config");
            const config = await response.json();
            const app = initializeApp(config);
            const db = getFirestore(app);
            const uid = localStorage.getItem("ta_uid");
            
            if (uid) {
                const userRef = doc(db, "users", uid);
                
                // Live Snapshot Listener (Auto Updates when DB changes)
                onSnapshot(userRef, (docSnap) => {
                    if (docSnap.exists()) {
                        let liveBalance = docSnap.data().balance;
                        if (liveBalance !== undefined) {
                            balance = liveBalance; // Update global variable
                            localStorage.setItem("ta_balance", liveBalance);
                            document.getElementById("main-balance").innerText = liveBalance;
                        }
                    }
                });

                // Function attached to window to let standard script deduct coins
                window.updateDBBalance = async (newBalance) => {
                    try {
                        await updateDoc(userRef, { balance: newBalance });
                    } catch(e) {
                        console.error("Failed to deduct from database:", e);
                    }
                };
            }
        } catch(err) {
            console.error("Firebase Live Sync couldn't start:", err);
        }
    }
    initLiveSync();
</script>
